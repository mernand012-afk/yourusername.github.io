<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bill Payment Tracker · Add & Pay</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
    }
    body {
      background: #f1f5f9;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .spreadsheet-container {
      background: white;
      width: 100%;
      max-width: 1100px;
      border-radius: 24px;
      box-shadow: 0 20px 35px -8px rgba(0, 0, 0, 0.2);
      padding: 24px 28px 32px;
      transition: all 0.2s;
    }
    h1 {
      font-size: 1.8rem;
      font-weight: 600;
      margin-top: 0;
      margin-bottom: 6px;
      color: #0f172a;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    h1 span {
      background: #dbeafe;
      color: #1e40af;
      font-size: 0.9rem;
      font-weight: 500;
      padding: 4px 12px;
      border-radius: 30px;
      letter-spacing: 0.3px;
    }
    .subhead {
      color: #475569;
      margin-bottom: 24px;
      font-size: 0.95rem;
      border-left: 4px solid #3b82f6;
      padding-left: 16px;
      background: #f8fafc;
      border-radius: 0 12px 12px 0;
      line-height: 1.4;
      padding: 10px 16px;
    }
    /* --- ADD FORM --- */
    .add-form {
      background: #f8fafc;
      border-radius: 18px;
      padding: 18px 20px;
      margin-bottom: 24px;
      border: 1px solid #e2e8f0;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: flex-end;
    }
    .add-form .form-group {
      flex: 1 1 160px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .add-form label {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      color: #475569;
    }
    .add-form input {
      padding: 10px 14px;
      border-radius: 40px;
      border: 1.5px solid #cbd5e1;
      font-size: 0.9rem;
      background: white;
      transition: border 0.15s, box-shadow 0.15s;
      width: 100%;
    }
    .add-form input:focus {
      outline: none;
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
    }
    .add-form input.error {
      border-color: #ef4444;
      box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.1);
    }
    .add-form .btn-add {
      background: #0f172a;
      color: white;
      border: none;
      padding: 10px 26px;
      border-radius: 40px;
      font-weight: 500;
      font-size: 0.9rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: background 0.15s, transform 0.1s;
      height: 42px;
      white-space: nowrap;
      flex: 0 0 auto;
    }
    .add-form .btn-add:hover {
      background: #1e293b;
    }
    .add-form .btn-add:active {
      transform: scale(0.97);
    }
    /* --- TABLE --- */
    .table-wrapper {
      overflow-x: auto;
      border-radius: 18px;
      border: 1px solid #e2e8f0;
      background: #ffffff;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.02);
    }
    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 680px;
      font-size: 0.95rem;
    }
    th {
      background: #f8fafc;
      color: #1e293b;
      font-weight: 600;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 18px 16px;
      text-align: left;
      border-bottom: 2px solid #e2e8f0;
    }
    td {
      padding: 16px;
      border-bottom: 1px solid #edf2f7;
      vertical-align: middle;
      color: #1e293b;
    }
    tr:last-child td {
      border-bottom: none;
    }
    tr:hover td {
      background: #fafcff;
    }
    .name {
      font-weight: 600;
      color: #0f172a;
    }
    .email {
      color: #2563eb;
      font-family: 'SF Mono', 'Fira Code', monospace;
      font-size: 0.9rem;
      background: #eff6ff;
      padding: 4px 10px;
      border-radius: 40px;
      display: inline-block;
      white-space: nowrap;
    }
    .amount {
      font-weight: 600;
      color: #0f172a;
    }
    .status-badge {
      display: inline-block;
      background: #f1f5f9;
      color: #334155;
      padding: 6px 14px;
      border-radius: 40px;
      font-size: 0.8rem;
      font-weight: 500;
      letter-spacing: 0.3px;
      white-space: nowrap;
    }
    .status-badge.paid {
      background: #dcfce7;
      color: #166534;
    }
    .check-btn {
      background: white;
      border: 1.5px solid #cbd5e1;
      color: #0f172a;
      font-weight: 500;
      padding: 9px 18px;
      border-radius: 40px;
      font-size: 0.85rem;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      transition: all 0.15s;
      box-shadow: 0 1px 2px rgba(0,0,0,0.02);
      white-space: nowrap;
    }
    .check-btn:hover {
      background: #f0f9ff;
      border-color: #3b82f6;
      color: #1e40af;
    }
    .check-btn:active {
      transform: scale(0.97);
    }
    .check-btn:disabled {
      opacity: 0.5;
      pointer-events: none;
      background: #f1f5f9;
      border-color: #cbd5e1;
      color: #64748b;
    }
    .check-btn i {
      font-style: normal;
      font-size: 1.1rem;
      line-height: 1;
    }
    .remove-btn {
      background: transparent;
      border: 1.5px solid #fecaca;
      color: #b91c1c;
      padding: 7px 14px;
      border-radius: 40px;
      font-size: 0.8rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
    }
    .remove-btn:hover {
      background: #fef2f2;
      border-color: #ef4444;
    }
    .remove-btn:active {
      transform: scale(0.97);
    }
    .toast-message {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: #0f172a;
      color: white;
      padding: 14px 28px;
      border-radius: 60px;
      font-weight: 500;
      font-size: 0.95rem;
      box-shadow: 0 18px 30px -8px rgba(0,0,0,0.35);
      opacity: 0;
      transition: opacity 0.2s, transform 0.2s;
      pointer-events: none;
      z-index: 999;
      display: flex;
      align-items: center;
      gap: 10px;
      backdrop-filter: blur(8px);
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid rgba(255,255,255,0.1);
      max-width: 90vw;
    }
    .toast-message.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
    .toast-message .icon {
      font-size: 1.2rem;
    }
    .footer-note {
      margin-top: 24px;
      font-size: 0.8rem;
      color: #64748b;
      text-align: center;
      border-top: 1px solid #e2e8f0;
      padding-top: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }
    .mock-hint {
      background: #fef9c3;
      color: #854d0e;
      padding: 6px 14px;
      border-radius: 40px;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.78rem;
    }
    .total-badge {
      background: #e2e8f0;
      padding: 6px 16px;
      border-radius: 40px;
      font-weight: 500;
      font-size: 0.8rem;
      color: #1e293b;
    }
    .action-cell {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
      flex-wrap: wrap;
    }
  </style>
</head>
<body>

<div class="spreadsheet-container">
  <h1>
    📋 Bill Tracker
    <span>add & pay</span>
  </h1>
  <div class="subhead">
    ⚡ Click <strong>“Check”</strong> to mark as paid — an automatic email confirmation will be sent to the address provided.
  </div>

  <!-- ADD FORM -->
  <div class="add-form" id="addFormContainer">
    <div class="form-group">
      <label for="newName">Full name</label>
      <input type="text" id="newName" placeholder="e.g. John Doe" autocomplete="off">
    </div>
    <div class="form-group">
      <label for="newEmail">Email address</label>
      <input type="email" id="newEmail" placeholder="john@example.com" autocomplete="off">
    </div>
    <div class="form-group" style="flex: 0 1 130px;">
      <label for="newAmount">Amount ($)</label>
      <input type="number" id="newAmount" placeholder="0.00" step="0.01" min="0.01" autocomplete="off">
    </div>
    <button class="btn-add" id="addBtn">
      <span>+</span> Add to list
    </button>
  </div>

  <!-- TABLE -->
  <div class="table-wrapper">
    <table>
      <thead>
        <tr>
          <th>Name</th>
          <th>Email</th>
          <th>Amount</th>
          <th>Status</th>
          <th style="text-align: right;">Action</th>
        </tr>
      </thead>
      <tbody id="billTableBody">
        <!-- Rows generated by JS -->
      </tbody>
    </table>
  </div>

  <div class="footer-note">
    <div class="mock-hint">
      ✉️ Demo mode: email is simulated (no real message sent)
    </div>
    <div id="paidCounter" class="total-badge">0 of 0 paid</div>
  </div>
</div>

<!-- Toast -->
<div id="toast" class="toast-message">
  <span class="icon">✉️</span>
  <span id="toastText">Email sent</span>
</div>

<script>
  (function() {
    // ----- INITIAL DATA -----
    const initialBills = [
      { id: 1, name: 'Lena Chen', email: 'lena.chen@example.com', amount: 89.50, paid: false },
      { id: 2, name: 'Marcus Rivera', email: 'marcus.r@example.com', amount: 45.00, paid: false },
      { id: 3, name: 'Priya Kapoor', email: 'priya.k@example.com', amount: 124.30, paid: false },
      { id: 4, name: 'James Okafor', email: 'j.okafor@example.com', amount: 62.75, paid: false },
      { id: 5, name: 'Sofia Lindqvist', email: 'sofia.l@example.com', amount: 210.00, paid: false },
    ];

    // ----- STATE -----
    let bills = JSON.parse(JSON.stringify(initialBills));
    let nextId = 6; // for new entries

    // ----- DOM ELEMENTS -----
    const tbody = document.getElementById('billTableBody');
    const toast = document.getElementById('toast');
    const toastText = document.getElementById('toastText');
    const paidCounter = document.getElementById('paidCounter');
    const addBtn = document.getElementById('addBtn');
    const newName = document.getElementById('newName');
    const newEmail = document.getElementById('newEmail');
    const newAmount = document.getElementById('newAmount');

    // ----- HELPER: escape HTML -----
    function escapeHtml(text) {
      if (!text) return '';
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // ----- RENDER TABLE -----
    function renderTable() {
      if (!tbody) return;

      let html = '';
      bills.forEach(bill => {
        const isPaid = bill.paid;
        const statusClass = isPaid ? 'status-badge paid' : 'status-badge';
        const statusText = isPaid ? '✅ Paid' : '⏳ Unpaid';
        const buttonDisabled = isPaid ? 'disabled' : '';
        const buttonLabel = isPaid ? 'Checked' : 'Check';

        html += `
          <tr data-id="${bill.id}">
            <td class="name">${escapeHtml(bill.name)}</td>
            <td><span class="email">${escapeHtml(bill.email)}</span></td>
            <td class="amount">$${bill.amount.toFixed(2)}</td>
            <td><span class="${statusClass}">${statusText}</span></td>
            <td style="text-align: right;">
              <div class="action-cell">
                <button class="check-btn" data-id="${bill.id}" ${buttonDisabled}>
                  <i>${isPaid ? '✓' : '☐'}</i> ${buttonLabel}
                </button>
                <button class="remove-btn" data-id="${bill.id}" title="Remove from list">
                  ✕
                </button>
              </div>
            </td>
          </tr>
        `;
      });

      tbody.innerHTML = html;

      // Update counter
      const paidCount = bills.filter(b => b.paid).length;
      paidCounter.textContent = `${paidCount} of ${bills.length} paid`;

      // Attach check button listeners
      document.querySelectorAll('.check-btn:not([disabled])').forEach(btn => {
        btn.addEventListener('click', handleCheckClick);
      });

      // Attach remove button listeners
      document.querySelectorAll('.remove-btn').forEach(btn => {
        btn.addEventListener('click', handleRemoveClick);
      });
    }

    // ----- HANDLE CHECK (PAY) -----
    function handleCheckClick(event) {
      const button = event.currentTarget;
      const billId = Number(button.getAttribute('data-id'));
      const bill = bills.find(b => b.id === billId);

      if (!bill || bill.paid) return;

      // Mark as paid
      bill.paid = true;

      // "Send email"
      sendEmailNotification(bill);

      // Re-render
      renderTable();
    }

    // ----- HANDLE REMOVE -----
    function handleRemoveClick(event) {
      const button = event.currentTarget;
      const billId = Number(button.getAttribute('data-id'));
      const bill = bills.find(b => b.id === billId);

      if (!bill) return;

      // Optional: confirm before removing? We'll just remove.
      // Filter out the bill
      bills = bills.filter(b => b.id !== billId);

      // Re-render
      renderTable();

      // Show a small toast about removal
      toastText.textContent = `🗑️ Removed "${bill.name}" from the list`;
      toast.classList.add('show');
      if (window.toastTimeout) clearTimeout(window.toastTimeout);
      window.toastTimeout = setTimeout(() => {
        toast.classList.remove('show');
      }, 2500);
    }

    // ----- SEND EMAIL (SIMULATED) -----
    function sendEmailNotification(bill) {
      const message = `✉️ Email sent to ${bill.email}: "You paid your bill for this month - $${bill.amount.toFixed(2)}"`;
      
      toastText.textContent = message;
      toast.classList.add('show');

      console.log(`[EMAIL SIMULATION] To: ${bill.email} | Subject: Payment confirmation | Body: "You paid your bill for this month. Amount: $${bill.amount.toFixed(2)}"`);

      if (window.toastTimeout) clearTimeout(window.toastTimeout);
      window.toastTimeout = setTimeout(() => {
        toast.classList.remove('show');
      }, 3500);
    }

    // ----- ADD NEW BILL -----
    function addNewBill() {
      // Clear previous error styles
      [newName, newEmail, newAmount].forEach(el => el.classList.remove('error'));

      const name = newName.value.trim();
      const email = newEmail.value.trim();
      const amountRaw = newAmount.value.trim();

      let hasError = false;

      // Validate name
      if (!name) {
        newName.classList.add('error');
        hasError = true;
      }

      // Validate email (simple)
      if (!email || !email.includes('@') || !email.includes('.')) {
        newEmail.classList.add('error');
        hasError = true;
      }

      // Validate amount
      const amount = parseFloat(amountRaw);
      if (!amountRaw || isNaN(amount) || amount <= 0) {
        newAmount.classList.add('error');
        hasError = true;
      }

      if (hasError) {
        // Show brief toast about missing fields
        toastText.textContent = '⚠️ Please fill all fields correctly.';
        toast.classList.add('show');
        if (window.toastTimeout) clearTimeout(window.toastTimeout);
        window.toastTimeout = setTimeout(() => {
          toast.classList.remove('show');
        }, 2500);
        return;
      }

      // Create new bill object
      const newBill = {
        id: nextId++,
        name: name,
        email: email,
        amount: amount,
        paid: false,
      };

      bills.push(newBill);

      // Clear form
      newName.value = '';
      newEmail.value = '';
      newAmount.value = '';

      // Re-render
      renderTable();

      // Show success toast
      toastText.textContent = `✅ Added "${name}" to the list`;
      toast.classList.add('show');
      if (window.toastTimeout) clearTimeout(window.toastTimeout);
      window.toastTimeout = setTimeout(() => {
        toast.classList.remove('show');
      }, 2500);
    }

    // ----- ATTACH ADD BUTTON LISTENER -----
    addBtn.addEventListener('click', addNewBill);

    // Allow pressing Enter in any of the add-form inputs to trigger add
    [newName, newEmail, newAmount].forEach(input => {
      input.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          addNewBill();
        }
      });
    });

    // ----- INITIAL RENDER -----
    renderTable();

    // Optional reset for console
    window.resetBills = function() {
      bills = JSON.parse(JSON.stringify(initialBills));
      nextId = 6;
      renderTable();
    };
  })();
</script>

</body>
</html>
